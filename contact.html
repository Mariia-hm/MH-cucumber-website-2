  <main class="contact-page">
    <div class="container">
      <h2>Contact Us</h2>
      <p>Please fill out the form below:</p>
<script type="text/javascript">var loc = "https://webanalyticsqa.clickdimensions.com/clickdimensionscom-atjrd/pages/";var cdSurveyCdn = "https://cdn-qa.clickdimensions.com/web/newformeditor/";</script>

      <p>We'd love to hear from you. Reach out with questions, feedback, or to start a conversation.</p>

      <form class="contact-form" action="https://formspree.io/f/your-form-id" method="POST">
        <label for="name">Name</label>
        <input type="text" id="name" name="name" required />

        <label for="email">Email</label>
        <input type="email" id="email" name="email" required />

        <label for="message">Message</label>
        <textarea id="message" name="message" rows="5" required></textarea>

        <button type="submit" class="btn">Send Message</button>
      </form>

      <hr />

      <h3>Subscribe to Our Newsletter</h3>
      <form class="newsletter-form" action="#" method="POST">
        <label for="newsletter-email">Email Address</label>
        <input type="email" id="newsletter-email" name="newsletter" placeholder="you@example.com" required />
        <button type="submit" class="btn">Subscribe</button>
      </form>
    </div>
